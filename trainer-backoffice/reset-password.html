<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Choose a new password · Lorenzo's Dog Training Team</title>
  <link rel="icon" href="/assets/ldtt-favicon.png">
  <link rel="stylesheet" href="/trainer-backoffice/styles.css?v=20260825reset">
</head>
<body class="is-logged-out">
  <section class="login-screen" aria-label="Choose a new password">
    <div class="login-card">
      <img src="/assets/lorenzo-logo-transparent.png" alt="Lorenzo's Dog Training Team">
      <p class="eyebrow">Staff Portal</p>
      <h1>Choose a new password</h1>
      <p id="resetIntro">Pick a password with at least 10 characters. You will use it the next time you sign in.</p>
      <form id="resetForm" class="login-form">
        <label>New password<input required minlength="10" name="password" type="password" autocomplete="new-password" placeholder="At least 10 characters"></label>
        <label>Type it again<input required minlength="10" name="confirmation" type="password" autocomplete="new-password" placeholder="Same password"></label>
        <button class="btn btn-red" type="submit" id="resetSubmit">Save my password</button>
      </form>
      <div class="login-status" id="resetStatus" role="status" aria-live="polite"></div>
      <p style="margin-top:14px"><a href="/staff">Back to the login page</a></p>
    </div>
  </section>

  <script>
  (() => {
    const params = new URLSearchParams(window.location.search);
    const link = { e: params.get("e"), c: params.get("c"), x: params.get("x"), s: params.get("s") };
    const form = document.getElementById("resetForm");
    const status = document.getElementById("resetStatus");
    const submit = document.getElementById("resetSubmit");

    // Same show/hide control the portal uses, so nobody locks themselves out by
    // mistyping a password they cannot see.
    form.querySelectorAll('input[type="password"]').forEach(input => {
      const shell = document.createElement("span");
      shell.className = "password-field";
      input.parentNode.insertBefore(shell, input);
      shell.appendChild(input);
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "password-peek";
      toggle.textContent = "Show";
      toggle.addEventListener("click", () => {
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        toggle.textContent = hidden ? "Hide" : "Show";
        input.focus();
      });
      shell.appendChild(toggle);
    });

    if (!link.e || !link.c || !link.x || !link.s) {
      form.hidden = true;
      status.textContent = "This link is incomplete. Go back to the login page and ask for a new reset email.";
      status.className = "login-status error";
      return;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const data = new FormData(form);
      const password = String(data.get("password") || "");
      if (password !== String(data.get("confirmation") || "")) {
        status.textContent = "The two passwords do not match.";
        status.className = "login-status error";
        return;
      }
      submit.disabled = true;
      status.textContent = "Saving your password…";
      status.className = "login-status";
      try {
        const response = await fetch("/api/portal-password-reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "set", ...link, password })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error(result.message || "The password could not be saved.");
        form.hidden = true;
        status.textContent = result.message + " Taking you to the login page…";
        status.className = "login-status success";
        setTimeout(() => { window.location.href = "/staff"; }, 2200);
      } catch (error) {
        submit.disabled = false;
        status.textContent = error.message;
        status.className = "login-status error";
      }
    });
  })();
  </script>
</body>
</html>
