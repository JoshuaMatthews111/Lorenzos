<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorenzo Trainer Network Portal</title>
  <meta name="description" content="Trainer Network admin and trainer portal for leads, clients, scheduling, website setup, themes, media, and white-label site management.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-logged-out">
  <section class="login-screen" id="loginScreen" aria-label="Trainer Network demo login">
    <div class="login-card">
      <img src="../assets/lorenzo-logo-transparent.png" alt="Lorenzo's Dog Training Team">
      <p class="eyebrow">Trainer Network Demo</p>
      <h1>Trainers Login</h1>
      <p>Use <strong>admin</strong> for the office dashboard or <strong>trainer</strong> for the trainer portal. Demo trainer password: <strong>doglovers26</strong>.</p>
      <form id="loginForm" class="login-form">
        <label>Username<input name="username" placeholder="admin or trainer" autocomplete="username"></label>
        <label>Password<input name="password" type="password" placeholder="doglovers26" autocomplete="current-password"></label>
        <button class="btn btn-red" type="submit">Enter Portal</button>
      </form>
      <div class="quick-login">
        <button class="btn btn-navy" type="button" data-login-role="admin">Enter as Admin</button>
        <button class="btn btn-outline" type="button" data-login-role="trainer">Enter as Trainer</button>
      </div>
    </div>
  </section>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="workspace">
      <header class="topbar" id="topbar"></header>
      <section id="workspaceView"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
