<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorenzo Trainer Network Portal</title>
  <meta name="description" content="Lorenzo back-office prototype for office-controlled trainer pages, leads, clients, imports, approvals, and reporting.">
  <link rel="stylesheet" href="/trainer-backoffice/styles.css?v=20260803photoRoles">
</head>
<body class="is-logged-out">
  <section class="login-screen" id="loginScreen" aria-label="Trainer Network login">
    <div class="login-card">
      <img src="../assets/lorenzo-logo-transparent.png" alt="Lorenzo's Dog Training Team">
      <p class="eyebrow">Trainer Network</p>
      <h1>Trainers Login</h1>
      <p>Authorized Lorenzo office staff and trainers can sign in with their assigned credentials.</p>
      <div class="portal-mode-toggle" aria-label="Choose portal login type">
        <button type="button" data-login-mode="admin">Admin / Office</button>
        <button class="active" type="button" data-login-mode="trainer">Trainer</button>
      </div>
      <p class="login-mode-help" id="loginModeHelp">Trainers sign in with their assigned trainer email and temporary or permanent password.</p>
      <form id="loginForm" class="login-form">
        <label>Username or Email<input required name="username" placeholder="Username or email" autocomplete="username"></label>
        <label>Password<input required name="password" type="password" placeholder="Password" autocomplete="current-password"></label>
        <button class="btn btn-red" type="submit">Enter Portal</button>
      </form>
      <div class="login-status" id="loginStatus" role="status" aria-live="polite"></div>
    </div>
  </section>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="workspace">
      <header class="topbar" id="topbar"></header>
      <section id="workspaceView"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/supabase-config.js"></script>
  <script src="/trainer-roster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="/trainer-backoffice/application-data.js?v=20260730ads3"></script>
  <script src="/trainer-backoffice/supabase.js?v=20260804identityShared"></script>
  <script src="/trainer-backoffice/app.js?v=20260804identityShared"></script>
</body>
</html>
