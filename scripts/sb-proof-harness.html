<link rel="stylesheet" href="/trainer-backoffice/styles.css">

  window.LDTT_PORTAL = { accessToken: () => "local-demo", currentAuthUser: () => ({ id: "local-office", email: "office@local.test" }) };
  window.state = { trainers: [] };
  window.session = { role: "admin" };
</script>
</head><body>
