<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorenzo Trainer Network Portal</title>
  <meta name="description" content="Lorenzo's office-controlled trainer network portal for trainer pages, leads, clients, approvals, and reporting.">
  <link rel="icon" href="assets/ldtt-favicon.png">
  <link rel="stylesheet" href="trainer-backoffice/styles.css?v=20260827audit1">
<!-- Meta pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '3790623554504010');
    fbq('track', 'PageView');
    document.addEventListener('submit', function(e){
      var f = e.target;
      if (!(f instanceof HTMLFormElement) || typeof fbq !== 'function') return;
      if (f.classList.contains('contact-intake')) fbq('track', 'Lead', { value: 250, currency: 'USD' });

<body class="is-logged-out">
  <section class="login-screen" id="loginScreen" aria-label="Trainer Network login">
    <div class="login-card">
      <img src="assets/lorenzo-logo-transparent.png" alt="Lorenzo's Dog Training Team">
      <p class="eyebrow">Trainer Network</p>
      <h1>Admin Login</h1>
      <p>Authorized Lorenzo office staff and trainers can sign in with their assigned credentials.</p>
      <div class="portal-mode-toggle" data-active-mode="admin" aria-label="Choose portal login type">
        <button class="active" type="button" data-login-mode="admin">Admin / Office</button>
        <button type="button" data-login-mode="trainer">Trainer</button>
      </div>
      <p class="login-mode-help" id="loginModeHelp">Office staff sign in with their assigned admin email and password.</p>
      <form id="loginForm" class="login-form">
          <label>Username or Email<input required name="username" placeholder="Username or email" autocomplete="username"></label>
          <label>Password<input required name="password" type="password" placeholder="Password" autocomplete="current-password"></label>
          <label class="login-persistence"><input type="checkbox" name="remember"><span>Keep me signed in on this device</span></label>
        <button class="btn btn-red" type="submit">Enter Portal</button>
      </form>
        <div class="login-status" id="loginStatus" role="status" aria-live="polite"></div>
      <div class="login-help-row"><button class="login-link-btn" type="button" id="forgotPasswordLink">Forgot password?</button></div>
      <form id="forgotForm" class="forgot-form" hidden>
        <p>Type the email you sign in with. If it has a portal account we email you a link to choose a new password.</p>
        <label>Email<input required type="email" name="email" placeholder="you@lorenzosdogtrainingteam.com" autocomplete="email"></label>
        <button class="btn btn-outline" type="submit">Email me a reset link</button>
        <div class="login-status" id="forgotStatus" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="workspace">
      <header class="topbar" id="topbar"></header>
      <section id="workspaceView"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="supabase-config.js"></script>
  <script src="trainer-roster.js"></script>
  <script src="trainer-backoffice/application-data.js?v=20260730ads3"></script>
  <script src="trainer-backoffice/supabase.js?v=20260827audit1"></script>
  <script src="trainer-backoffice/app.js?v=20260827audit1"></script>
</body>
</html>
